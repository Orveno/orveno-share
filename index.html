<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Watch this on Orveno">
<meta property="og:site_name" content="Orveno">
<title>Orveno</title>
<style>
  :root { color-scheme: dark; --pink:#fe2c55; --teal:#20d3c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { background: radial-gradient(120% 60% at 50% 0%, #1a0f1c 0%, #000 60%); min-height: 100vh; }
  .page { max-width: 460px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px 14px; }
  .logo { font-weight: 800; font-size: 24px; letter-spacing: .4px;
    background: linear-gradient(90deg, var(--teal), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 12px; color: #9a9a9a; letter-spacing: .3px; }

  .stage { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 74vh; margin: 0 auto;
    background: #0b0b0b; border-radius: 20px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07); }
  .stage video, .stage img, .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; object-fit: contain; background: #000; }
  .stage iframe { object-fit: initial; }

  .center-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .18s; }
  .center-play span { width: 74px; height: 74px; border-radius: 50%; background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; }
  .stage.paused .center-play { opacity: 1; }
  .center-play svg { width: 34px; height: 34px; fill: #fff; margin-left: 4px; }

  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0)); display: flex; align-items: center; gap: 10px; }
  .ibtn { border: 0; background: none; color: #fff; padding: 6px; display: flex; cursor: pointer; }
  .ibtn svg { width: 22px; height: 22px; fill: #fff; }
  .time { font-size: 12px; color: #ddd; min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { position: relative; flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .bar .fill { position: absolute; left: 0; height: 4px; border-radius: 2px; width: 0;
    background: linear-gradient(90deg, var(--teal), var(--pink)); }
  .bar .dot { position: absolute; left: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,.2); }

  .spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .spin { width: 38px; height: 38px; border: 3px solid #2a2a2a; border-top-color: var(--teal); border-radius: 50%;
    animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  .meta { margin-top: 18px; padding: 0 2px; }
  .user { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--teal), var(--pink)); font-weight: 700; font-size: 17px; color: #000; }
  .handle { font-size: 16px; font-weight: 600; }
  .cap { margin-top: 12px; font-size: 16px; line-height: 1.5; color: #e9e9e9; word-break: break-word; white-space: pre-wrap; }
  .stats { display: flex; gap: 18px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.09);
    color: #bdbdbd; font-size: 14px; }
  .stats b { color: #fff; font-weight: 600; margin-right: 4px; }
  .stats svg { width: 16px; height: 16px; fill: #bdbdbd; vertical-align: -3px; margin-right: 5px; }

  .msg { padding: 90px 24px; text-align: center; color: #9a9a9a; font-size: 17px; line-height: 1.6; }
  .msg .big { font-size: 40px; margin-bottom: 8px; }
  footer { margin-top: 28px; text-align: center; font-size: 12px; color: #6f6f6f; }
</style>
</head>
<body>
<div class="page">
  <header><div class="logo">Orveno</div><div class="tag">Short videos</div></header>
  <main id="app">
    <div class="stage"><div class="spinner"><div class="spin"></div></div></div>
  </main>
  <footer>Shared from Orveno</footer>
</div>

<script>
(function () {
  // Firebase project id (project_id in google-services.json)
  var PROJECT_ID = "neontiktokclone";

  var app = document.getElementById("app");
  var ICON = {
    play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
    vol:   '<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
    mute:  '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12a7 7 0 0 1-.9 3.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.6-1.8l2.1 2.1 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>',
    full:  '<svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.5 3 5 6.4 5c2 0 3.4 1.1 4.2 2.4h.8C12.2 6.1 13.6 5 15.6 5 19 5 21.1 8.5 19.6 11.9 17.5 16.4 12 21 12 21z"/></svg>',
    chat:  '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>',
    eye:   '<svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.7 9.1 1 12c1.7 2.9 5.5 7 11 7s9.3-4.1 11-7c-1.7-2.9-5.5-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>'
  };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function str(f) { return f && f.stringValue ? f.stringValue : ""; }
  function num(f) { return f && f.integerValue ? parseInt(f.integerValue, 10) : 0; }
  function fmtCount(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }
  function fmtTime(s) {
    if (!isFinite(s)) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function showMsg(icon, text) {
    app.innerHTML = "";
    var d = el("div", "msg");
    var big = el("div", "big"); big.textContent = icon;
    d.appendChild(big);
    d.appendChild(document.createTextNode(text));
    app.appendChild(d);
  }

  // Video player with our own English controls
  function buildPlayer(stage, fileId) {
    var video = document.createElement("video");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.muted = true;
    video.loop = true;
    video.autoplay = true;
    video.preload = "auto";
    video.src = "https://drive.google.com/uc?export=download&id=" + fileId;
    stage.appendChild(video);

    var spinner = el("div", "spinner", '<div class="spin"></div>');
    stage.appendChild(spinner);
    var cp = el("div", "center-play", "<span>" + ICON.play + "</span>");
    stage.appendChild(cp);

    var controls = el("div", "controls");
    var playBtn = el("button", "ibtn", ICON.pause);
    playBtn.setAttribute("aria-label", "Play or pause");
    var bar = el("div", "bar", '<div class="track"></div><div class="fill"></div><div class="dot"></div>');
    var time = el("div", "time", "0:00 / 0:00");
    var muteBtn = el("button", "ibtn", ICON.mute);
    muteBtn.setAttribute("aria-label", "Sound");
    var fsBtn = el("button", "ibtn", ICON.full);
    fsBtn.setAttribute("aria-label", "Fullscreen");
    controls.appendChild(playBtn);
    controls.appendChild(bar);
    controls.appendChild(time);
    controls.appendChild(muteBtn);
    controls.appendChild(fsBtn);
    stage.appendChild(controls);

    var fill = bar.querySelector(".fill");
    var dot = bar.querySelector(".dot");

    function toggle() {
      if (video.paused) video.play().catch(function () {}); else video.pause();
    }
    function sync() {
      var d = video.duration || 0, t = video.currentTime || 0;
      var p = d ? Math.min(100, (t / d) * 100) : 0;
      fill.style.width = p + "%";
      dot.style.left = p + "%";
      time.textContent = fmtTime(t) + " / " + fmtTime(d);
    }
    video.addEventListener("timeupdate", sync);
    video.addEventListener("loadedmetadata", sync);
    video.addEventListener("playing", function () { spinner.style.display = "none"; stage.classList.remove("paused"); playBtn.innerHTML = ICON.pause; });
    video.addEventListener("waiting", function () { spinner.style.display = "flex"; });
    video.addEventListener("canplay", function () { spinner.style.display = "none"; });
    video.addEventListener("pause", function () { stage.classList.add("paused"); playBtn.innerHTML = ICON.play; });

    video.addEventListener("click", toggle);
    playBtn.addEventListener("click", toggle);
    muteBtn.addEventListener("click", function () {
      video.muted = !video.muted;
      muteBtn.innerHTML = video.muted ? ICON.mute : ICON.vol;
    });
    fsBtn.addEventListener("click", function () {
      if (video.webkitEnterFullscreen && !stage.requestFullscreen) { video.webkitEnterFullscreen(); return; }
      if (document.fullscreenElement) document.exitFullscreen();
      else if (stage.requestFullscreen) stage.requestFullscreen();
    });

    function seekFrom(ev) {
      var r = bar.getBoundingClientRect();
      var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var p = Math.max(0, Math.min(1, x / r.width));
      if (video.duration) video.currentTime = p * video.duration;
    }
    var dragging = false;
    bar.addEventListener("pointerdown", function (e) { dragging = true; bar.setPointerCapture(e.pointerId); seekFrom(e); });
    bar.addEventListener("pointermove", function (e) { if (dragging) seekFrom(e); });
    bar.addEventListener("pointerup", function () { dragging = false; });

    // If the direct stream cannot be played, fall back to Drive's own player (English)
    var failed = false;
    function fallback() {
      if (failed) return;
      failed = true;
      stage.innerHTML = "";
      var ifr = document.createElement("iframe");
      ifr.src = "https://drive.google.com/file/d/" + fileId + "/preview?hl=en";
      ifr.allow = "autoplay; fullscreen";
      ifr.setAttribute("allowfullscreen", "");
      stage.appendChild(ifr);
    }
    video.addEventListener("error", fallback);
    setTimeout(function () { if (video.readyState < 2) fallback(); }, 9000);
  }

  var id = new URLSearchParams(location.search).get("v");
  if (!id) { showMsg("🎬", "This link is not valid."); return; }

  fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
        "/databases/(default)/documents/videos/" + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw new Error("nf"); return r.json(); })
    .then(function (doc) {
      var f = doc.fields || {};
      if ((str(f.privacy) || "everyone") !== "everyone") { showMsg("🔒", "This video is private."); return; }

      var fileId = "";
      try { fileId = str(f.storage.mapValue.fields.fileId); } catch (e) {}
      if (!fileId) {
        var m = /files\/([A-Za-z0-9_-]+)/.exec(str(f.videoUrl));
        if (m) fileId = m[1];
      }
      if (!fileId) { showMsg("🎬", "This video is not available."); return; }

      var isVideo = !(f.isVideo && f.isVideo.booleanValue === false);
      var handle = str(f.username).replace(/^@/, "");
      var cap = str(f.caption) || str(f.title);
      if (cap === "Untitled") cap = "";

      app.innerHTML = "";
      var stage = el("div", "stage");
      app.appendChild(stage);

      if (isVideo) {
        buildPlayer(stage, fileId);
      } else {
        var img = document.createElement("img");
        img.alt = "";
        img.src = "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1600";
        stage.appendChild(img);
      }

      var meta = el("div", "meta");
      if (handle) {
        var u = el("div", "user");
        var av = el("div", "avatar"); av.textContent = handle.charAt(0).toUpperCase();
        var h = el("div", "handle"); h.textContent = "@" + handle;
        u.appendChild(av); u.appendChild(h);
        meta.appendChild(u);
      }
      if (cap) {
        var c = el("div", "cap"); c.textContent = cap;
        meta.appendChild(c);
      }
      var st = el("div", "stats",
        "<span>" + ICON.eye + "<b>" + fmtCount(num(f.views)) + "</b></span>" +
        "<span>" + ICON.heart + "<b>" + fmtCount(num(f.likeCount)) + "</b></span>" +
        "<span>" + ICON.chat + "<b>" + fmtCount(num(f.commentCount)) + "</b></span>");
      meta.appendChild(st);
      app.appendChild(meta);
      document.title = (cap ? cap + " · " : "") + "Orveno";
    })
    .catch(function () { showMsg("🎬", "This video is not available."); });
})();
</script>
</body>
</html>
